<head>
<meta charset="utf-8">

  <meta name="robots" content="noindex">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#0a0506">
  <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48">
  <link rel="apple-touch-icon" href="/assets/brand/apple-touch-icon.png">
  <style>
    :root{--raven:#0a0506;--paper:#f4efe9;--mute:#a49c9a;--powder:#b6ddf3;--line:rgba(244,239,233,.14);
      --mono:"Cascadia Mono",Consolas,"Liberation Mono",monospace;--disp:Bahnschrift,"DIN Alternate","Arial Narrow","Helvetica Neue",Arial,sans-serif}
    *{box-sizing:border-box}
    html{background:var(--raven)}
    body{margin:0;min-height:100vh;min-height:100svh;display:grid;place-items:center;padding:24px 16px;background:var(--raven);color:var(--paper);font:450 18px/1.5 var(--disp)}
    main{width:100%;max-width:520px;text-align:center}
    .mark{display:inline-flex;align-items:center;gap:10px;color:var(--paper);text-decoration:none;font:600 14px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase}
    .mark svg{width:22px;height:22px;fill:none;stroke:currentColor}
    .code{margin:40px 0 4px;font:600 clamp(64px,18vw,120px)/1 var(--mono);letter-spacing:.04em;color:var(--powder)}
    h1{margin:0 0 32px;font-size:clamp(22px,5vw,30px);font-weight:600}
    nav{display:flex;justify-content:center;gap:12px;flex-wrap:wrap}
    nav a{display:inline-block;min-width:120px;padding:12px 20px;border:1px solid var(--line);border-radius:999px;color:var(--paper);text-decoration:none;font:600 15px/1 var(--mono);letter-spacing:.06em}
    nav a:first-child{background:var(--powder);border-color:var(--powder);color:var(--raven)}
    nav a:hover,nav a:focus-visible{border-color:var(--powder);outline:none}
    nav a:first-child:hover,nav a:first-child:focus-visible{background:var(--paper);border-color:var(--paper)}
  </style>
</head>
<body>
<main>

  <p class="code" aria-hidden="true">404</p>

</body>
</html>
