# "Send with GitHub" Worker for ds5untethered.com/translate (verified-identity sending). Steps: OWNER-SETUP.md.
# Public values only. The two secrets (OAUTH_CLIENT_SECRET, APP_PRIVATE_KEY) are set with `npx wrangler secret put`.
name = "ds5-translate-auth"
main = "worker.js"
compatibility_date = "2026-11-01"

# Served on the site's own zone, so the zone's rate limiting rule covers it. No workers.dev address.
workers_dev = false
routes = [{ pattern = "translate-auth.ds5untethered.com", custom_domain = true }]

# Keep no logs or traces.
[observability]
enabled = false

[vars]
# The OAuth App "DS5 Untethered Translate" (no scopes): its Client ID. Public.
OAUTH_CLIENT_ID = "REPLACE_WITH_OAUTH_CLIENT_ID"
# The GitHub App "ds5-untethered-translate": its App ID (a number, shown on the App's settings page). Public.
APP_ID = "REPLACE_WITH_APP_ID"
# The repository the GitHub App is installed on. Issues are opened here.
REPO = "Midzer00/ds5-untethered"
# "true" also accepts requests from http://localhost:8765. Leave "false" on the live Worker.
DEV = "false"

# Per-IP limit, checked before anything else (needs Wrangler 4.36 or newer). Counts are per Cloudflare location.
# namespace_id is any positive number not used by another limiter in the account.
[[ratelimits]]
name = "LIMITER"
namespace_id = "4101"

  [ratelimits.simple]
  limit = 10
  period = 60

# Per-volunteer burst limit, keyed by GitHub user id. Cloudflare allows only 10 or 60 second periods here, so the
# hourly cap (5 sends per user id per hour) comes from the SUBMIT_LOG namespace below.
[[ratelimits]]
name = "USER_LIMITER"
namespace_id = "4102"

  [ratelimits.simple]
  limit = 2
  period = 60

# Site-wide limit on verified sends (every account together), one key for the whole Worker. Optional: without this
# block there is no site-wide cap. Counts are per Cloudflare location, so it is approximate.
[[ratelimits]]
name = "GLOBAL_LIMITER"
namespace_id = "4103"

  [ratelimits.simple]
  limit = 20
  period = 60

# Send times per user id, each entry deleted after one hour. Create it with
#   npx wrangler kv namespace create SUBMIT_LOG
# and paste the id it prints. Without this block the hourly cap is off; the limits above still apply. With it, a store
# that fails to read or write refuses the send (rate_limited). KV is eventually consistent, so the cap is approximate.
[[kv_namespaces]]
binding = "SUBMIT_LOG"
id = "REPLACE_WITH_KV_NAMESPACE_ID"
